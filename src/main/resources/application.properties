# Spring properties
spring.application.name=e-commerce-backend

# Server properties
server.port=8080

# Logging properties
logging.level.root=INFO
logging.level.com.carlosarroyoam.ecommerce=INFO

# RSA Keys properties
app.rsa.private-key: classpath:certs/private.pem
app.rsa.public-key: classpath:certs/public.pem

# JWT properties
app.jwt.access-token-ttl-ms=${JWT_ACCESS_TOKEN_TTL_MS:300000}
app.jwt.refresh-token-ttl-ms=${JWT_REFRESH_TOKEN_TTL_MS:86400000}
app.jwt.refresh-token-max-lifetime-ms=${JWT_REFRESH_TOKEN_MAX_LIFETIME_MS:2592000000}

# Cookie properties
app.cookie.secure=${COOKIE_SECURE:true}

# CORS properties
app.cors.allowed-origins=http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS
app.cors.allowed-headers=authorization,accept,content-type,x-requested-with,x-xsrf-token
app.cors.exposed-headers=x-xsrf-token
app.cors.allow-credentials=true

# Database properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_URL:localhost:3306}/spring-boot-e-commerce
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:toor}

# Hibernate properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Spring MVC properties
spring.web.resources.add-mappings=false
spring.web.locale=en_US
spring.web.locale-resolver=fixed

# Jackson properties
spring.jackson.property-naming-strategy=SNAKE_CASE
