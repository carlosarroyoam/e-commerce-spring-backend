# Perfil "test": el datasource lo inyecta @ServiceConnection desde el contenedor
# Testcontainers (ver AbstractIntegrationTest); aqui solo van overrides de comportamiento.

# Cookies sin HTTPS en tests (MockMvc/TestRestTemplate no negocian TLS)
application.cookie.secure=false

# TTLs cortos para poder probar expiracion de tokens sin esperas largas
application.jwt.access-token-ttl-ms=2000
application.jwt.refresh-token-ttl-ms=5000
application.jwt.refresh-token-max-lifetime-ms=15000

# Se mantiene validate (no create-drop) a proposito: los tests de integracion
# tambien deben detectar si schema.sql deja de ser compatible con las entidades JPA.
spring.jpa.hibernate.ddl-auto=validate

# ddl-auto=validate no crea tablas: se aplica schema.sql explicitamente contra
# el contenedor antes de que Hibernate valide el esquema. test-data-reset.sql
# vacia las tablas que puebla data.sql (TRUNCATE, no DROP) para que un
# contenedor Testcontainers reutilizado entre ejecuciones de mvn (withReuse)
# no falle por clave primaria duplicada al reinsertar el seed.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:sql/test-data-reset.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8

logging.level.org.hibernate.SQL=WARN
